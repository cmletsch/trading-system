name: Backfill Runners

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print only, do not write to the sheet)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Backfill runner rows (60 days)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID:     ${{ secrets.SPREADSHEET_ID }}
          POLYGON_API_KEY:    ${{ secrets.POLYGON_API_KEY }}
          DRY_RUN:            ${{ github.event.inputs.dry_run }}
        run: python scripts/backfill_runners.py
