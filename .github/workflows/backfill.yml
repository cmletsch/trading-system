name: Backfill EOD for Specific Date

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Date to backfill (YYYY-MM-DD)'
        required: true
        default: '2026-06-18'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run EOD backfill
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID:     ${{ secrets.SPREADSHEET_ID }}
          POLYGON_API_KEY:    ${{ secrets.POLYGON_API_KEY }}
          EOD_TARGET_DATE:    ${{ inputs.target_date }}
          SKIP_SCORING:       "1"
        run: python scripts/eod_update.py
      - name: Commit data files to GitHub
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/
          git diff --staged --quiet || git commit -m "Backfill data update ${{ inputs.target_date }}"
          git pull --rebase origin main
          git push
