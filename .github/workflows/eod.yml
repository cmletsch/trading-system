name: EOD Trading Update

on:
  schedule:
    # Always 8 PM New York time. GitHub cron is UTC, so schedule both possible UTC
    # hours; the "gate" job below lets only the one that is 8 PM ET actually run.
    #   8 PM EDT (summer) = 00:00 UTC,  8 PM EST (winter) = 01:00 UTC  (Tue-Sat UTC)
    - cron: '0 0 * * 2-6'
    - cron: '0 1 * * 2-6'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Backfill date (YYYY-MM-DD). Leave blank for auto-detect.'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          # Decide from WHICH cron fired, not from the clock at run time: GitHub can delay scheduled
          # runs by hours, and a clock check then skips the run (this happened 11/19, the 11/18 update never ran).
          # 8 PM New York = 00:00 UTC in summer (EDT, -0400) or 01:00 UTC in winter (EST, -0500).
          OFF=$(TZ=America/New_York date +%z)
          if [ "$OFF" = "-0400" ]; then WANT='0 0 * * 2-6'; else WANT='0 1 * * 2-6'; fi
          echo "event=${{ github.event_name }} fired=[${{ github.event.schedule }}] wanted=[$WANT] offset=$OFF"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "$WANT" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Duplicate trigger for the other UTC hour - skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  eod-update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EOD update
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID:     ${{ secrets.SPREADSHEET_ID }}
          POLYGON_API_KEY:    ${{ secrets.POLYGON_API_KEY }}
          EOD_TARGET_DATE:    ${{ github.event.inputs.target_date }}
        run: python scripts/eod_update.py

      - name: Commit data files to GitHub
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/
          git diff --staged --quiet || git commit -m "EOD data update $(date -u '+%Y-%m-%d')"
          git pull --rebase origin main
          git push
