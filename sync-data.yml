name: Sync Trading Data from Google Sheets

on:
  schedule:
    # 8:30 PM ET = 01:30 UTC next day (covers EST; runs 9:30 PM during EDT — still fine)
    - cron: '30 1 * * 2-6'
  workflow_dispatch: # allow manual trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread google-auth

      - name: Sync data from Google Sheets
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python scripts/sync_data.py

      - name: Commit and push data files
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: auto-sync trading data $(date -u +'%Y-%m-%d %H:%M UTC')" && \
            git push
